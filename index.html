<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <base href="/chat/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0f766e"/>
    <title>BioChat — Doenças e Meio Ambiente</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="chat-container">
        <header class="app-header">
            <img src="robo.jpg" alt="Avatar do BioChat" class="header-avatar">
            <div class="header-title">
                <h1>BioChat</h1>
                <span class="header-subtitle">Doenças e Meio Ambiente</span>
            </div>
            <button id="install-button" style="display: none;">Instalar</button>
        </header>

        <main id="chat-box"></main>

        <footer class="message-form-container">
            <form id="message-form">
                <input type="text" id="message-input" placeholder="Pergunte sobre doenças ou meio ambiente...">
                <button type="submit" id="submit-button">Enviar</button>
            </form>
        </footer>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('Service Worker registered with scope:', registration.scope);
                }).catch(err => {
                    console.log('Service Worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
